name: Machine Research

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Wie viele offene Maschinen pro Lauf?"
        required: false
        default: "12"
        type: string
      workers:
        description: "Wie viele Research-Worker parallel?"
        required: false
        default: "6"
        type: string
      model:
        description: "Gemini-Modell"
        required: false
        default: "gemini-2.5-flash-lite"
        type: string
  schedule:
    - cron: "17 */2 * * *"

concurrency:
  group: machine-research
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RESEARCH_BATCH_SIZE: ${{ inputs.batch_size || '12' }}
      RESEARCH_WORKERS: ${{ inputs.workers || '6' }}
      GEMINI_MODEL: ${{ inputs.model || 'gemini-2.5-flash-lite' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install 'google-genai>=1.40,<2' 'jsonschema>=4.23,<5'
      - name: Validate backlog before research
        run: python scripts/research_machines.py --validate-only
      - name: Run research workers
        run: python scripts/research_machines.py
      - name: Commit generated machine data
        run: |
          git config user.name "machine-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add machines_backlog.json maschinendaten/
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -m "research: update machine data"
          git push
